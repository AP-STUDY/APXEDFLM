<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MovieBox</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#141414;--bg2:#1f1f1f;--card:#2a2a2a;--accent:#e50914;--text:#e5e5e5;--text2:#a3a3a3;--line:#3a3a3a;--blue:#0a84ff;--green:#1f9d55;--nav:64px}
[data-theme="light"]{--bg:#f4f4f4;--bg2:#fff;--card:#fff;--text:#1a1a1a;--text2:#5c5c5c;--line:#d8d8d8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(var(--nav) + 12px);overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
/* Loading */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:400;color:var(--accent);font-size:2.4rem}
/* Header */
header{position:sticky;top:0;z-index:50;background:var(--bg2);box-shadow:0 2px 12px rgba(0,0,0,.35);display:flex;align-items:center;gap:14px;padding:10px 14px}
.logo{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{color:var(--accent)}
.searchbox{position:relative;flex:1}
.searchbox input{width:100%;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:0 44px 0 16px;font-size:16px}
.searchbox i{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--text2);pointer-events:none}
/* Carousel */
#carousel{position:relative;height:320px;perspective:1200px;overflow:hidden;margin-top:8px;touch-action:pan-y}
.stage{position:absolute;inset:0;transform-style:preserve-3d}
.slide{position:absolute;left:50%;top:14px;bottom:14px;width:min(58%,240px);margin-left:calc(min(58%,240px)/-2);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .7s;will-change:transform}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.9));color:#fff;font-weight:700;font-size:.95rem;text-align:center}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff}
.arrow.l{left:8px}.arrow.r{right:8px}
/* Chips */
#chips{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:44px;padding:0 18px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-weight:600;transition:background .15s}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* Grid */
h2.sec{padding:4px 14px 10px;font-size:1.1rem}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 14px}
.card{background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--line);transition:transform .2s,box-shadow .2s;text-align:left;padding:0;display:block;width:100%}
.card:active{transform:scale(.97)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--bg)}
.card .t{padding:8px 10px 10px}
.card h3{font-size:.92rem;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .g{font-size:.78rem;color:var(--text2)}
.stars{font-size:.8rem;color:var(--text2);margin-top:3px}.stars i{color:#f5b50a}
.skel{aspect-ratio:2/3.5;border-radius:8px;background:linear-gradient(90deg,var(--card) 25%,var(--line) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{grid-column:1/-1;text-align:center;color:var(--text2);padding:40px 12px}
.empty i{font-size:2.2rem;display:block;margin-bottom:10px;opacity:.6}
/* Bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav);background:var(--bg2);border-top:1px solid var(--line);display:flex;z-index:60}
nav button{flex:1;background:none;border:0;color:var(--text2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;min-height:44px}
nav button i{font-size:1.2rem}nav button.on{color:var(--accent)}
/* Modals */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:16px}
.panel{background:var(--bg2);border-radius:10px;width:100%;max-width:560px;margin:auto;padding:20px;position:relative}
.xbtn{position:fixed;top:14px;right:14px;z-index:210;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:1.1rem}
.poster{width:100%;max-height:420px;object-fit:contain;border-radius:8px;background:var(--bg);display:block}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-close{margin-top:8px}
.panel h2{font-size:1.5rem;margin:14px 0 6px}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);padding:3px 12px;border-radius:20px;font-size:.8rem;margin-right:8px}
.avg{color:var(--text2);font-size:.9rem}.avg i{color:#f5b50a}
.panel p.d{margin:12px 0;line-height:1.55;color:var(--text2);overflow-wrap:anywhere}
.rate{display:flex;align-items:center;gap:2px;margin:10px 0 14px}
.rate button{background:none;border:0;font-size:1.6rem;color:var(--line);width:44px;height:44px}
.rate button.on{color:#f5b50a}
.rate small{color:var(--text2);margin-left:6px}
.btns{display:grid;gap:10px}
.btn{min-height:48px;border:0;border-radius:8px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);color:var(--text);border:1px solid var(--line);width:100%}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.fav i{color:var(--accent)}
.note{margin-top:10px;font-size:.88rem;color:var(--green);min-height:1.2em}
/* Settings & auth */
.set{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:10px;width:100%;text-align:left}
.set>i{font-size:1.3rem;color:var(--accent);width:28px;text-align:center}
.set div{flex:1}.set b{display:block}.set span{font-size:.83rem;color:var(--text2)}
.sw{width:50px;height:28px;border-radius:14px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
[data-theme="dark"] .sw{background:var(--accent)}[data-theme="dark"] .sw::after{transform:translateX(22px)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:600}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.field{margin-bottom:14px}.field label{display:block;font-size:.88rem;font-weight:600;margin-bottom:5px}
.field input{width:100%;min-height:44px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.err{background:rgba(229,9,20,.15);border:1px solid var(--accent);color:#ff6b72;padding:10px;border-radius:6px;margin-bottom:12px;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px);transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 18px;border-radius:22px;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.4)}
@media(min-width:768px){#grid{grid-template-columns:repeat(4,1fr);gap:16px;padding:0 24px}h2.sec,#chips{padding-left:24px}.card:hover{transform:translateY(-6px);box-shadow:0 12px 24px rgba(0,0,0,.5)}}
@media(min-width:1025px){#grid{grid-template-columns:repeat(5,1fr)}#carousel{height:380px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="loading"><i class="fa-solid fa-film"></i></div>

<header>
  <div class="logo"><i class="fa-solid fa-film"></i> MovieBox</div>
  <div class="searchbox"><input id="search" type="search" placeholder="Search movies" aria-label="Search movies"><i class="fa-solid fa-magnifying-glass"></i></div>
</header>

<main>
  <div id="carousel" aria-label="Latest movies">
    <div class="stage" id="stage"></div>
    <button class="arrow l" id="prev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="arrow r" id="next" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
  <div id="chips" role="tablist" aria-label="Genres"></div>
  <h2 class="sec" id="secTitle">All movies</h2>
  <div id="grid"></div>
</main>

<nav aria-label="Main">
  <button data-nav="home" class="on"><i class="fa-solid fa-house"></i>Home</button>
  <button data-nav="search"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
  <button data-nav="favs"><i class="fa-solid fa-heart"></i>Favorites</button>
  <button data-nav="settings"><i class="fa-solid fa-gear"></i>Settings</button>
</nav>

<div id="modalRoot"></div>
<div id="toast" class="hidden" role="status"></div>

<script>
// ===== Firebase Configuration =====
// Replace with your Firebase project credentials
const firebaseConfig = {
  apiKey: "AIzaSyDOEFZzPDrmIX_b2ri3K6n-_2jRtp1m5aU",
  authDomain: "apxedflm-8faf9.firebaseapp.com",
  databaseURL: "https://apxedflm-8faf9-default-rtdb.firebaseio.com",
  projectId: "apxedflm-8faf9",
  storageBucket: "apxedflm-8faf9.firebasestorage.app",
  messagingSenderId: "878259300856",
  appId: "1:878259300856:web:3acd8da2c07cf84de64e0d"
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect width="200" height="300" fill="#333"/><text x="100" y="155" fill="#888" font-size="14" text-anchor="middle">No image</text></svg>');
const IMG = 'onerror="this.onerror=null;this.src=\'' + FALLBACK + '\'"';

let allMovies = [], currentUser = null, db, auth;
let genre = "All", query = "", view = "home", favorites = [], myRatings = {};
let cIndex = 0, cTimer = null, cList = [];

// ----- Storage helpers (safe) -----
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), 2500);
}

// ----- Theme -----
function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); }
function toggleTheme() {
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(t); store.set("theme", t);
}

// ----- Firebase init -----
function initializeFirebase() {
  try {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth(); db = firebase.database();
    auth.onAuthStateChanged(async u => {
      currentUser = u; myRatings = {};
      if (u) {
        try { const s = await db.ref("users/" + u.uid + "/ratings").once("value"); myRatings = s.val() || {}; } catch (e) { console.error(e); }
      }
    });
    loadMovies();
  } catch (e) {
    console.error("Firebase init failed:", e);
    $("loading").classList.add("hidden");
    renderGrid();
    toast("Firebase isn't configured yet");
  }
}

// ----- Data -----
function loadMovies() {
  db.ref("movies").on("value", snap => {
    const v = snap.val() || {};
    allMovies = Object.entries(v).map(([id, m]) => ({ id, ...m })).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    $("loading").classList.add("hidden");
    loadGenres(); buildCarousel(); renderGrid();
    // Refresh open detail modal (live rating updates)
    if (openId) { const m = allMovies.find(x => x.id === openId); if (m) refreshRating(m); }
  }, err => { console.error(err); $("loading").classList.add("hidden"); toast("Could not load movies"); renderGrid(); });
}
function loadGenres() {
  const gs = ["All", ...new Set(allMovies.map(m => m.genre).filter(Boolean))];
  if (!gs.includes(genre)) genre = "All";
  $("chips").innerHTML = gs.map(g => `<button class="chip ${g === genre ? "on" : ""}" role="tab" aria-selected="${g === genre}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
}
const avgOf = m => m.ratingCount ? (m.ratingTotal / m.ratingCount) : 0;

// ----- Grid -----
function visibleMovies() {
  const q = query.toLowerCase();
  return allMovies.filter(m =>
    (view !== "favs" || favorites.includes(m.id)) &&
    (genre === "All" || m.genre === genre) &&
    (!q || (m.title || "").toLowerCase().includes(q) || (m.genre || "").toLowerCase().includes(q)));
}
function renderGrid() {
  const g = $("grid");
  $("secTitle").textContent = view === "favs" ? "My favorites" : (genre === "All" ? "All movies" : genre);
  if (!db && !allMovies.length || (db && !allMovies.length && $("loading") && !$("loading").classList.contains("hidden"))) {
    g.innerHTML = Array(6).fill('<div class="skel"></div>').join(""); return;
  }
  const list = visibleMovies();
  if (!list.length) {
    g.innerHTML = `<div class="empty"><i class="fa-solid ${view === "favs" ? "fa-heart" : "fa-film"}"></i>${
      view === "favs" ? "No favorites yet. Open a movie and tap Add to Favorites." :
      query || genre !== "All" ? "No movies match. Try another search or genre." : "No movies yet. Check back soon."}</div>`;
    return;
  }
  g.innerHTML = list.map(m => `<button class="card" data-id="${esc(m.id)}" aria-label="${esc(m.title)}">
    <img src="${esc(m.poster)}" alt="" loading="lazy" ${IMG}>
    <div class="t"><h3>${esc(m.title)}</h3><div class="g">${esc(m.genre)}</div>
    <div class="stars"><i class="fa-solid fa-star"></i> ${avgOf(m).toFixed(1)} (${m.ratingCount || 0})</div></div></button>`).join("");
}

// ----- 3D carousel -----
function buildCarousel() {
  cList = allMovies.slice(0, 5);
  const c = $("carousel");
  c.classList.toggle("hidden", !cList.length);
  if (cIndex >= cList.length) cIndex = 0;
  $("stage").innerHTML = cList.map(m => `<div class="slide" data-id="${esc(m.id)}"><img src="${esc(m.poster)}" alt="${esc(m.title)}" ${IMG}><div class="cap">${esc(m.title)}</div></div>`).join("");
  positionSlides(); startAuto();
}
function positionSlides() {
  const n = cList.length;
  [...$("stage").children].forEach((el, i) => {
    let d = i - cIndex;                       // circular offset
    if (d > n / 2) d -= n; if (d < -n / 2) d += n;
    const a = Math.abs(d);
    el.style.transform = `translateX(${d * 62}%) translateZ(${-a * 160}px) rotateY(${-d * 28}deg)`;
    el.style.opacity = a > 2 ? 0 : 1 - a * 0.3;
    el.style.zIndex = 10 - a;
    el.style.pointerEvents = a > 1 ? "none" : "auto";
  });
}
function go(step) { const n = cList.length; if (!n) return; cIndex = (cIndex + step + n) % n; positionSlides(); startAuto(); }
function startAuto() {
  clearInterval(cTimer);
  if (cList.length > 1 && !matchMedia("(prefers-reduced-motion:reduce)").matches) cTimer = setInterval(() => go(1), 4000);
}

// ----- Video embed -----
function convertToEmbedUrl(url) {
  try {
    const u = new URL(url), h = u.hostname.replace(/^www\./, "");
    if (h === "youtu.be") return "https://www.youtube.com/embed/" + u.pathname.slice(1) + "?autoplay=1";
    if (h.endsWith("youtube.com")) {
      if (u.pathname.startsWith("/embed/")) return "https://www.youtube.com" + u.pathname + "?autoplay=1";
      const id = u.searchParams.get("v"); if (id) return "https://www.youtube.com/embed/" + id + "?autoplay=1";
    }
    if (h === "vimeo.com") { const id = u.pathname.split("/").filter(Boolean).pop(); return "https://player.vimeo.com/video/" + id + "?autoplay=1"; }
    if (h === "player.vimeo.com") return url + (url.includes("?") ? "&" : "?") + "autoplay=1";
    if (h.endsWith("dailymotion.com")) { const id = u.pathname.split("/").pop().split("_")[0]; return "https://www.dailymotion.com/embed/video/" + id + "?autoplay=1"; }
    if (h === "dai.ly") return "https://www.dailymotion.com/embed/video/" + u.pathname.slice(1) + "?autoplay=1";
    return url;   // assume it's already an embeddable URL
  } catch (e) { return url; }
}
const isFile = url => /\.(mp4|webm|ogg|m3u8)(\?|$)/i.test(url);
function playMovie(url) {
  const box = $("playerBox");
  const src = isFile(url) ? `<video src="${esc(url)}" controls autoplay playsinline></video>`
    : `<iframe src="${esc(convertToEmbedUrl(url))}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Movie player"></iframe>`;
  $("playerWrap").classList.remove("hidden"); $("poster").classList.add("hidden");
  box.innerHTML = src;
}
function stopMovie() { $("playerBox").innerHTML = ""; $("playerWrap").classList.add("hidden"); $("poster").classList.remove("hidden"); }

// ----- Movie detail modal -----
let openId = null;
function openMovieDetail(id) {
  const m = allMovies.find(x => x.id === id); if (!m) return;
  openId = id; clearInterval(cTimer);
  const fav = favorites.includes(id);
  showModal(`<button class="xbtn" data-close aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    <img id="poster" class="poster" src="${esc(m.poster)}" alt="Poster of ${esc(m.title)}" ${IMG}>
    <div id="playerWrap" class="hidden"><div class="player" id="playerBox"></div>
      <button class="btn player-close" id="closePlayer"><i class="fa-solid fa-xmark"></i> Close player</button></div>
    <h2>${esc(m.title)}</h2>
    <div><span class="tag">${esc(m.genre)}</span><span class="avg" id="avgLine"></span></div>
    <p class="d">${esc(m.description)}</p>
    <div class="rate" id="rate" aria-label="Rate this movie"></div>
    <div class="btns">
      ${m.playUrl ? '<button class="btn blue" id="playBtn"><i class="fa-solid fa-play"></i> Play Now</button>' : ""}
      ${m.downloadUrl ? '<button class="btn green" id="dlBtn"><i class="fa-solid fa-download"></i> Download Movie</button>' : ""}
      <button class="btn fav" id="favBtn"><i class="${fav ? "fa-solid" : "fa-regular"} fa-heart"></i> ${fav ? "Remove from Favorites" : "Add to Favorites"}</button>
      <button class="btn" id="reportBtn"><i class="fa-solid fa-flag"></i> Report Broken Link</button>
    </div><div class="note" id="note" role="status"></div>`, () => { stopMovieSafe(); openId = null; startAuto(); });
  refreshRating(m);
  if ($("playBtn")) $("playBtn").onclick = () => playMovie(m.playUrl);
  if ($("dlBtn")) $("dlBtn").onclick = () => window.open(m.downloadUrl, "_blank", "noopener");
  $("closePlayer").onclick = stopMovie;
  $("favBtn").onclick = () => toggleFav(id);
  $("reportBtn").onclick = () => reportBroken(m);
}
const stopMovieSafe = () => { const b = $("playerBox"); if (b) b.innerHTML = ""; };
function refreshRating(m) {
  if (!$("avgLine")) return;
  $("avgLine").innerHTML = `<i class="fa-solid fa-star"></i> ${avgOf(m).toFixed(1)} (${m.ratingCount || 0} votes)`;
  const mine = myRatings[m.id] || 0;
  $("rate").innerHTML = [1, 2, 3, 4, 5].map(n => `<button class="${n <= mine ? "on" : ""}" data-star="${n}" aria-label="${n} star${n > 1 ? "s" : ""}"><i class="fa-solid fa-star"></i></button>`).join("") +
    (currentUser ? (mine ? `<small>Your rating: ${mine}</small>` : "") : "<small>Log in to rate</small>");
}
async function rateMovie(m, n) {
  if (!currentUser) { toast("Log in to rate movies"); return openAuth(); }
  const prev = myRatings[m.id] || 0;
  try {
    // Transaction keeps totals correct when several people rate at once
    await db.ref("movies/" + m.id).transaction(cur => {
      if (!cur) return cur;
      cur.ratingTotal = (cur.ratingTotal || 0) - prev + n;
      cur.ratingCount = (cur.ratingCount || 0) + (prev ? 0 : 1);
      return cur;
    });
    await db.ref("users/" + currentUser.uid + "/ratings/" + m.id).set(n);
    myRatings[m.id] = n; toast("Thanks for rating");
  } catch (e) { console.error(e); toast("Could not save rating"); }
}

// ----- Favorites (localStorage, works offline) -----
function toggleFav(id) {
  favorites = favorites.includes(id) ? favorites.filter(x => x !== id) : [...favorites, id];
  store.set("favorites", JSON.stringify(favorites));
  const on = favorites.includes(id);
  $("favBtn").innerHTML = `<i class="${on ? "fa-solid" : "fa-regular"} fa-heart"></i> ${on ? "Remove from Favorites" : "Add to Favorites"}`;
  if (view === "favs") renderGrid();
}
async function reportBroken(m) {
  try {
    await db.ref("reports").push({ movieId: m.id, movieTitle: m.title, userId: currentUser ? currentUser.uid : "Anonymous", timestamp: Date.now() });
    $("note").textContent = "Thanks! We'll check this link.";
  } catch (e) { console.error(e); $("note").textContent = "Could not send the report. Log in and try again."; }
}

// ----- Modal helper -----
let onClose = null;
function showModal(html, closeCb) {
  closeModal();
  $("modalRoot").innerHTML = `<div class="modal" id="modal"><div class="panel">${html}</div></div>`;
  onClose = closeCb || null; document.body.style.overflow = "hidden";
}
function closeModal() {
  if (!$("modal")) return;
  if (onClose) onClose(); onClose = null;
  $("modalRoot").innerHTML = ""; document.body.style.overflow = "";
}

// ----- Settings -----
function openSettings() {
  showModal(`<button class="xbtn" data-close aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    <h2 style="margin-top:0">Settings</h2>
    <button class="set" id="setTheme"><i class="fa-solid fa-circle-half-stroke"></i><div><b>Dark mode</b><span>Switch between dark and light</span></div><span class="sw"></span></button>
    <button class="set" id="setFavs"><i class="fa-solid fa-heart"></i><div><b>My favorites</b><span>${favorites.length} saved</span></div></button>
    <button class="set" id="setAcct">${currentUser
      ? `<span class="avatar">${esc((currentUser.displayName || currentUser.email || "?")[0].toUpperCase())}</span><div><b>${esc(currentUser.displayName || "Account")}</b><span>${esc(currentUser.email)} · Tap to log out</span></div>`
      : '<i class="fa-solid fa-user"></i><div><b>Account</b><span>Log in or sign up</span></div>'}</button>
    <div class="set"><i class="fa-solid fa-circle-info"></i><div><b>App version</b><span>MovieBox 1.0.0</span></div></div>`);
  $("setTheme").onclick = toggleTheme;
  $("setFavs").onclick = () => { closeModal(); setView("favs"); };
  $("setAcct").onclick = () => { if (currentUser) { auth.signOut().then(() => { toast("Logged out"); closeModal(); }); } else openAuth(); };
}

// ----- Auth -----
function openAuth(tab = "login") {
  showModal(`<button class="xbtn" data-close aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    <div class="tabs"><button data-tab="login" class="${tab === "login" ? "on" : ""}">Login</button><button data-tab="signup" class="${tab === "signup" ? "on" : ""}">Sign Up</button></div>
    <div id="authErr" class="err hidden" role="alert"></div>
    <form id="authForm" novalidate>
      ${tab === "signup" ? '<div class="field"><label for="aName">Full name</label><input id="aName" autocomplete="name"></div>' : ""}
      <div class="field"><label for="aEmail">Email address</label><input id="aEmail" type="email" autocomplete="username"></div>
      <div class="field"><label for="aPw">Password</label><input id="aPw" type="password" autocomplete="${tab === "signup" ? "new-password" : "current-password"}"></div>
      ${tab === "signup" ? '<div class="field"><label for="aPw2">Confirm password</label><input id="aPw2" type="password" autocomplete="new-password"></div>' : ""}
      <button class="btn accent" id="authBtn" type="submit">${tab === "signup" ? "Create account" : "Log in"}</button>
    </form>`);
  $("authForm").onsubmit = e => { e.preventDefault(); tab === "signup" ? signup() : login(); };
}
const authErr = t => { $("authErr").textContent = t; $("authErr").classList.remove("hidden"); };
async function login() {
  const email = $("aEmail").value.trim(), pw = $("aPw").value;
  if (!email || !pw) return authErr("Enter your email and password.");
  $("authBtn").disabled = true;
  try { await auth.signInWithEmailAndPassword(email, pw); closeModal(); toast("Welcome back"); }
  catch (e) { console.error(e); authErr("Login failed. Check your email and password."); $("authBtn").disabled = false; }
}
async function signup() {
  const name = $("aName").value.trim(), email = $("aEmail").value.trim(), pw = $("aPw").value, pw2 = $("aPw2").value;
  if (!name || !email || !pw || !pw2) return authErr("Fill in every field.");
  if (pw.length < 6) return authErr("Password must be at least 6 characters.");
  if (pw !== pw2) return authErr("Passwords don't match.");
  $("authBtn").disabled = true;
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    await cred.user.updateProfile({ displayName: name });
    await db.ref("users/" + cred.user.uid).set({ name, email, createdAt: Date.now() });
    closeModal(); toast("Account created");
  } catch (e) { console.error(e); authErr(e.code === "auth/email-already-in-use" ? "That email already has an account. Try logging in." : "Sign up failed: " + e.message); $("authBtn").disabled = false; }
}
function logout() { return auth.signOut(); }

// ----- Navigation -----
function setView(v) {
  if (v === "home" || v === "favs") view = v;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.nav === v));
  $("carousel").classList.toggle("hidden", view === "favs" || !cList.length);
  renderGrid(); window.scrollTo({ top: 0, behavior: "smooth" });
}

// ----- Events -----
window.addEventListener("DOMContentLoaded", () => {
  applyTheme(store.get("theme", "dark"));
  try { favorites = JSON.parse(store.get("favorites", "[]")) || []; } catch (e) { favorites = []; }

  let t; $("search").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { query = e.target.value.trim(); renderGrid(); }, 200); });
  $("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; genre = b.dataset.g; loadGenres(); renderGrid(); });
  $("grid").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openMovieDetail(c.dataset.id); });
  $("stage").addEventListener("click", e => { const s = e.target.closest(".slide"); if (s) openMovieDetail(s.dataset.id); });
  $("prev").onclick = () => go(-1); $("next").onclick = () => go(1);

  // Swipe support
  let sx = null; const car = $("carousel");
  car.addEventListener("touchstart", e => { sx = e.touches[0].clientX; clearInterval(cTimer); }, { passive: true });
  car.addEventListener("touchend", e => { if (sx !== null) { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); else startAuto(); sx = null; } });

  document.querySelector("nav").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const n = b.dataset.nav;
    if (n === "settings") return openSettings();
    if (n === "search") { setView("home"); $("search").focus(); return; }
    setView(n);
  });

  // Delegated modal handlers
  $("modalRoot").addEventListener("click", e => {
    if (e.target.id === "modal" || e.target.closest("[data-close]")) return closeModal();
    const tab = e.target.closest("[data-tab]"); if (tab) return openAuth(tab.dataset.tab);
    const star = e.target.closest("[data-star]");
    if (star) { const m = allMovies.find(x => x.id === openId); if (m) rateMovie(m, +star.dataset.star).then(() => refreshRating(m)); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  initializeFirebase();
});
</script>
</body>
</html>
